<script defer>
const firebaseConfig = {
  apiKey: "AIzaSyB2ApaKYijeKrrsoValyUnlALovx35VLWc",
  authDomain: "ahmedalynawy2005.firebaseapp.com",
  projectId: "ahmedalynawy2005",
  storageBucket: "ahmedalynawy2005.firebasestorage.app",
  messagingSenderId: "509080098937",
  appId: "1:509080098937:web:e370ff675c79d873601ca8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

// معرف ثابت للبيانات المشتركة بين كل الأجهزة
const CLOUD_DOC = 'ahmedalynawy2005_data';
const DB_KEYS=['profile','timetable','exams','plan','completed','gen','net','semesters','uniInfo','academicManual','documents','albums','deptNames','deptIcons','semCount','deptPlanImg','deptPlanNames','deptPlanIcons'];

window.showSyncStatus=function(msg){
  let el=document.getElementById('sync-status');
  if(!el){el=document.createElement('div');el.id='sync-status';
    el.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1c1f2e;border:1px solid #2f3347;border-radius:10px;padding:8px 16px;color:#eef0f8;font-size:12px;z-index:999999;transition:opacity .5s;font-family:Tajawal,sans-serif';
    document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},3000);
};

// يحافظ على البيانات الكبيرة المحلية (صور/مرفقات) لما تجي نسخة "مُقلّمة" من السحابة بدل ما تمحيها
function preserveLargeLocal(key,cloudValue){
  try{
    if(key==='documents'&&Array.isArray(cloudValue)){
      const localDocs=JSON.parse(localStorage.getItem('tdb_documents')||'[]');
      return cloudValue.map((cd,i)=>{
        if(cd&&cd.data==='__large_local__'){
          const match=localDocs[i];
          if(match&&match.data&&match.name===cd.name)return{...cd,data:match.data};
        }
        return cd;
      });
    }
    if(key==='albums'&&Array.isArray(cloudValue)){
      const localAlbums=JSON.parse(localStorage.getItem('tdb_albums')||'[]');
      return cloudValue.map((ca,ai)=>{
        if(!ca||!Array.isArray(ca.photos))return ca;
        const localA=localAlbums[ai];
        return{...ca,photos:ca.photos.map((p,pi)=>{
          if(p==='__large_local__'){
            const lp=localA&&localA.photos&&localA.photos[pi];
            if(lp)return lp;
          }
          return p;
        })};
      });
    }
  }catch(e){}
  return cloudValue;
}
window.saveAllToCloud=async function(){
  try{
    const all={};
    // حفظ الـ keys الثابتة
    DB_KEYS.forEach(k=>{const v=localStorage.getItem('tdb_'+k);if(v)all[k]=JSON.parse(v);});
    // حفظ كلمة مرور التطبيق (لتكون موحدة على كل الأجهزة)
    all.apppass=localStorage.getItem('tdb_apppass')||'';
    // حفظ الأقسام الديناميكية (dept_xxxx)
    try{
      const dn=JSON.parse(localStorage.getItem('tdb_deptNames')||'{}');
      Object.keys(dn).forEach(k=>{
        if(!DB_KEYS.includes(k)){const v=localStorage.getItem('tdb_'+k);if(v)all[k]=JSON.parse(v);}
      });
    }catch(ex){}
    // حفظ المستندات بدون بيانات الصور الكبيرة (تتزامن البيانات فقط)
    if(all.documents){
      all.documents=all.documents.map(d=>{
        if(d.data&&d.data.length>500000){
          return {...d,data:'__large_local__'}; // صور كبيرة تبقى محلية
        }
        return d;
      });
    }
    // نفس الحماية لصور الألبومات (كانت مفقودة، وهذا كان يسبب فشل الحفظ بصمت)
    if(all.albums){
      all.albums=all.albums.map(a=>{
        if(!a||!Array.isArray(a.photos))return a;
        return{...a,photos:a.photos.map(p=>(p&&p.length>300000)?'__large_local__':p)};
      });
    }
    const payload=JSON.stringify(all);
    // فحص الحجم (Firestore حد 1MB)
    if(payload.length>900000){
      // حذف بيانات الصور كلها لو الحجم كبير
      if(all.documents){
        all.documents=all.documents.map(d=>({...d,data:d.data?'__large_local__':undefined}));
      }
      if(all.albums){
        all.albums=all.albums.map(a=>(a&&Array.isArray(a.photos))?{...a,photos:a.photos.map(p=>p?'__large_local__':p)}:a);
      }
    }
    const finalPayload=JSON.stringify(all);
    if(finalPayload.length>1000000){
      showSyncStatus('⚠️ حجم البيانات كبير جداً — لم تتم المزامنة');
      return;
    }
    await db.collection('tdb').doc(CLOUD_DOC).set({value:finalPayload,updated:Date.now()});
    showSyncStatus('✅ تمت المزامنة');
  }catch(e){
    console.log('save error:',e.code,e.message);
    if(e.code==='invalid-argument'||(e.message&&e.message.indexOf('exceeds')>=0)){
      showSyncStatus('⚠️ حجم البيانات تجاوز الحد المسموح — محفوظ محلياً فقط');
    }else{
      showSyncStatus('📵 لا يوجد إنترنت — محفوظ محلياً');
    }
  }
};

window.loadFromCloud=async function(){
  try{
    const snap=await db.collection('tdb').doc(CLOUD_DOC).get();
    if(snap.exists){
      const allData=JSON.parse(snap.data().value);
      Object.keys(allData).forEach(k=>{
        if(k==='apppass'){
          if(allData.apppass)localStorage.setItem('tdb_apppass',allData.apppass);
          else localStorage.removeItem('tdb_apppass');
          return;
        }
        const val=(k==='documents'||k==='albums')?preserveLargeLocal(k,allData[k]):allData[k];
        localStorage.setItem('tdb_'+k,JSON.stringify(val));
      });
      // تحميل الأقسام الديناميكية في DB
      if(window.DB){
        DB_KEYS.forEach(k=>{try{const v=localStorage.getItem('tdb_'+k);if(v)window.DB[k]=JSON.parse(v);}catch(e){}});
        try{
          const dn=JSON.parse(localStorage.getItem('tdb_deptNames')||'{}');
          Object.keys(dn).forEach(k=>{try{const v=localStorage.getItem('tdb_'+k);if(v)window.DB[k]=JSON.parse(v);}catch(e){}});
        }catch(e){}
      }
      return true;
    }
  }catch(e){console.log('load error:',e.code,e.message);}
  return false;
};

// Real-time listener - يستمع للتغييرات من الأجهزة الأخرى فوراً
window.startRealtimeSync=function(){
  if(typeof db==='undefined'||typeof CLOUD_DOC==='undefined')return;
  if(window._realtimeUnsub)window._realtimeUnsub();
  let firstCall=true;
  window._realtimeUnsub=db.collection('tdb').doc(CLOUD_DOC).onSnapshot(snap=>{
    if(firstCall){firstCall=false;return;} // تجاهل أول استجابة (عند التشغيل)
    if(!snap.exists)return;
    if(snap.metadata&&snap.metadata.hasPendingWrites)return; // تجاهل صدى حفظ هذا الجهاز نفسه (يمنع تضارب حفظ صورة مضافة للتو)
    try{
      const allData=JSON.parse(snap.data().value);
      Object.keys(allData).forEach(k=>{
        if(k==='apppass'){
          if(allData.apppass)localStorage.setItem('tdb_apppass',allData.apppass);
          else localStorage.removeItem('tdb_apppass');
          return;
        }
        const val=(k==='documents'||k==='albums')?preserveLargeLocal(k,allData[k]):allData[k];
        localStorage.setItem('tdb_'+k,JSON.stringify(val));
      });
      // تحديث DB في الذاكرة
      if(window.DB){
        DB_KEYS.forEach(k=>{try{const v=localStorage.getItem('tdb_'+k);if(v)window.DB[k]=JSON.parse(v);}catch(e){}});
        try{
          const dn=JSON.parse(localStorage.getItem('tdb_deptNames')||'{}');
          Object.keys(dn).forEach(k=>{try{const v=localStorage.getItem('tdb_'+k);if(v)window.DB[k]=JSON.parse(v);}catch(e){}});
        }catch(e){}
      }
      showSyncStatus('🔄 تم استقبال تحديث من جهاز آخر');
      // إعادة رسم الصفحة الحالية
      if(window.pageStack&&window.pageStack.length>0&&window.renderPage){
        const cur=window.pageStack[window.pageStack.length-1];
        const c=document.getElementById('page-content');
        if(c)window.renderPage(cur);
      }
    }catch(e){console.log('realtime error:',e);}
  },err=>console.log('snapshot error:',err));
};
</script>

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px)}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:580px;max-width:96vw;max-height:88vh;overflow-y:auto;padding:24px;transform:translateY(20px);transition:transform .2s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px}
.fg{margin-bottom:12px}.fl{font-size:11px;color:var(--text2);font-weight:700;margin-bottom:4px;display:block;text-transform:uppercase}
.fi,.fs{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Tajawal','Noto Sans Arabic',Tahoma,Arial,sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.fi:focus,.fs:focus{border-color:var(--accent)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}

/* ── MISC ── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:rgba(67,233,123,.15);color:var(--green)}.bb{background:rgba(79,172,254,.15);color:var(--blue)}
.bp{background:rgba(108,99,255,.15);color:var(--accent)}.by{background:rgba(249,202,36,.15);color:var(--yellow)}
.br{background:rgba(245,87,108,.15);color:var(--red)}
.toolbar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-inp{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:'Tajawal','Noto Sans Arabic',Tahoma,Arial,sans-serif;font-size:13px;outline:none;width:180px}
.search-inp:focus{border-color:var(--accent)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:500px){.fr{grid-template-columns:1fr}.timetable td{min-width:60px}.exam-rows{grid-template-columns:1fr}}
</style>
</head>

<div id="pre-gate" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#0a1628 0%,#0d2040 40%,#0a1a35 100%);display:flex;align-items:center;justify-content:center">
  <div style="width:54px;height:54px;border:2px solid #c9a84c;border-radius:50%;background:linear-gradient(135deg,#0f2d4a,#1a3d5c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(201,168,76,.3)">
    <span style="font-size:24px">🎓</span>
  </div>

<!-- ══════════════════ HOME ══════════════════ -->
<div id="home">

<div id="home-header" style="width:100%;max-width:720px;margin-bottom:4px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;position:relative">
      <button onclick="editUniInfo()" style="position:absolute;top:9px;left:9px;background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;z-index:3">✏️</button>
      <div style="display:flex;align-items:center;gap:14px">
        <div id="uni-photo-wrap" style="flex-shrink:0"></div>
        <script>
        (function(){try{var u=JSON.parse(localStorage.getItem('tdb_uniInfo')||'{}');var w=document.currentScript.previousElementSibling;w.innerHTML=u.uniPhoto?'<img src="'+u.uniPhoto+'" style="width:56px;height:56px;border-radius:12px;object-fit:cover;display:block">':'<div style=\"width:56px;height:56px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px\">🏛️</div>';}catch(e){}})()</script>
        <div style="flex:1;text-align:center;min-width:0">
          <div style="font-size:14px;font-weight:800;color:var(--accent)">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</div>
          <div id="hdr-country" style="font-size:13px;color:var(--text);font-weight:700;margin-top:3px">الدولة / ليبيا</div>
          <div id="hdr-ministry" style="font-size:13px;color:var(--text);font-weight:700">وزارة التعليم العالي والبحث العلمي</div>
          <div id="hdr-admin" style="font-size:13px;color:var(--text);font-weight:700">الإدارة العامة / الخمس</div>
          <div id="hdr-uniname" style="font-size:13px;font-weight:700;color:var(--text)">جامعة المرقب / كلية تقنية المعلومات</div>
          <div id="hdr-name" style="font-size:14px;font-weight:900;color:var(--accent);margin-top:6px;border-top:1px solid var(--border);padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">احمد ابو صلاح محمد العيناوي</div>
        </div>
        <div id="col-photo-wrap" style="flex-shrink:0"></div>
        <script>
        (function(){try{var u=JSON.parse(localStorage.getItem('tdb_uniInfo')||'{}');var w=document.currentScript.previousElementSibling;w.innerHTML=u.collegePhoto?'<img src="'+u.collegePhoto+'" style="width:56px;height:56px;border-radius:12px;object-fit:cover;display:block">':'<div style=\"width:56px;height:56px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px\">🎓</div>';}catch(e){}})()</script>
      </div>
    </div>
  </div>
  <div class="home-cards" id="home-cards-wrap">
    <button type="button" class="home-card" onclick="openPage('profile')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#6c63ff,#ff6584)">👤</div>
      <div class="home-card-info"><h3>الملف الشخصي</h3><p>البيانات الشخصية والمعلومات</p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('current-sem')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">📅</div>
      <div class="home-card-info"><h3>الفصل الحالي</h3><p>الخطة والجدول والامتحانات</p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('semesters')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#667eea,#764ba2)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="1.5" stroke="white" stroke-width="1.8"/><rect x="6" y="4" width="12" height="16" rx="0.5" fill="rgba(255,255,255,0.15)"/><circle cx="15" cy="12" r="1.3" fill="white"/><line x1="2" y1="22" x2="22" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="4" x2="12" y2="20" stroke="white" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/></svg></div>
      <div class="home-card-info"><h3>الفصول الدراسية</h3><p id="hc-sem-count"><script>try{document.write((JSON.parse(localStorage.getItem('tdb_semCount')||'10'))+' فصول دراسية')}catch(e){document.write('10 فصول دراسية')}</script></p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('depts')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">📚</div>
      <div class="home-card-info"><h3>الأقسام الدراسية</h3><p id="hc-dept-names"><script>try{var _dn=JSON.parse(localStorage.getItem('tdb_deptNames')||'{"gen":"قسم العام","net":"قسم الشبكات"}');document.write(Object.values(_dn).map(function(v){return v.replace('قسم ','')}).join(' · '))}catch(e){document.write('العام · الشبكات')}</script></p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('completed')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#f9ca24,#f0932b)">✅</div>
      <div class="home-card-info"><h3>المقررات المكتملة</h3><p>المواد التي تم اجتيازها</p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('academic-record')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#f5576c,#f093fb)">📊</div>
      <div class="home-card-info"><h3>السجل الدراسي</h3><p>الإحصائيات والمعدل العام</p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('documents')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#30cfd0,#667eea)">📁</div>
      <div class="home-card-info"><h3>المستندات</h3><p>صور وملفات PDF ووثائق</p></div>
    </button>
    <button type="button" class="home-card" onclick="openPage('settings')">
      <div class="home-card-icon" style="background:linear-gradient(135deg,#636e72,#2d3436)">⚙️</div>
      <div class="home-card-info"><h3>الإعدادات</h3><p>تصدير واستيراد البيانات</p></div>
    </button>
  </div>
</div>

// ══ LOAD / SAVE ══
function ld(k){
  try{
    const v=localStorage.getItem('tdb_'+k);
    if(v)return JSON.parse(v);
  }catch(e){}
  try{
    const v=sessionStorage.getItem('tdb_'+k);
    if(v)return JSON.parse(v);
  }catch(e){}
  return DEF[k]?JSON.parse(JSON.stringify(DEF[k])):null;
}
function sv(k,d){
  try{localStorage.setItem('tdb_'+k,JSON.stringify(d));}catch(e){}
  try{sessionStorage.setItem('tdb_'+k,JSON.stringify(d));}catch(e){}
  if(typeof window.saveAllToCloud==='function'){
    clearTimeout(window._syncTimer);
    window._syncTimer=setTimeout(()=>window.saveAllToCloud(),2000);
  }
}

function saveMediaBlob(id,file){
  return new Promise((res,rej)=>{
    try{
      const req=indexedDB.open('tdb_blobs',1);
      req.onupgradeneeded=e=>e.target.result.createObjectStore('blobs',{keyPath:'id'});
      req.onsuccess=e=>{
        try{
          const db=e.target.result;
          const tx=db.transaction('blobs','readwrite');
          tx.objectStore('blobs').put({id,blob:file,name:file.name,mimeType:file.type});
          tx.oncomplete=()=>{db.close();res();};
          tx.onerror=()=>{db.close();rej();};
        }catch(e){rej(e);}
      };
      req.onerror=()=>rej();
    }catch(e){rej(e);}
  });
}

function loadMediaBlob(id){
  return new Promise((res)=>{
    try{
      const req=indexedDB.open('tdb_blobs',1);
      req.onupgradeneeded=e=>e.target.result.createObjectStore('blobs',{keyPath:'id'});
      req.onsuccess=e=>{
        try{
          const db=e.target.result;
          const r=db.transaction('blobs','readonly').objectStore('blobs').get(id);
          r.onsuccess=ev=>{
            db.close();
            if(ev.target.result){
              const blob=ev.target.result.blob;
              const url=URL.createObjectURL(blob);
              res(url);
            }else res(null);
          };
          r.onerror=()=>{db.close();res(null);};
        }catch(e){res(null);}
      };
      req.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}

function delMediaBlob(id){
  if(!id)return;
  try{
    const req=indexedDB.open('tdb_blobs',1);
    req.onsuccess=e=>{
      const db=e.target.result;
      try{db.transaction('blobs','readwrite').objectStore('blobs').delete(id);}catch(e){}
      db.close();
    };
  }catch(e){}
}
let _idb=null;
function getIDB(){
  return new Promise((res,rej)=>{
    try{
      if(_idb)return res(_idb);
      if(!window.indexedDB)return rej('no idb');
      const req=indexedDB.open('tdb_media',1);
      req.onupgradeneeded=e=>e.target.result.createObjectStore('files',{keyPath:'id'});
      req.onsuccess=e=>{_idb=e.target.result;res(_idb);};
      req.onerror=()=>rej('idb error');
      req.onblocked=()=>rej('idb blocked');
    }catch(e){rej(e);}
  });
}
function saveMedia(id,data){
  return getIDB().then(db=>{
    return new Promise((res,rej)=>{
      try{
        const tx=db.transaction('files','readwrite');
        tx.objectStore('files').put({id,data});
        tx.oncomplete=()=>res();
        tx.onerror=()=>rej();
      }catch(e){rej(e);}
    });
  });
}
function loadMedia(id){
  return getIDB().then(db=>{
    return new Promise((res)=>{
      try{
        const req=db.transaction('files','readonly').objectStore('files').get(id);
        req.onsuccess=e=>res(e.target.result?e.target.result.data:null);
        req.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  }).catch(()=>null);
}
function delMedia(id){
  if(!id)return;
  getIDB().then(db=>{
    try{
      const tx=db.transaction('files','readwrite');
      tx.objectStore('files').delete(id);
    }catch(e){}
  }).catch(()=>{});
}

let pageStack=[];
function openPage(page,title){
  pageStack.push(page);
  document.getElementById('home').style.display='none';
  document.getElementById('app').style.display='flex';
  renderPage(page,title);
}
function goBack(){
  // لو داخل فصل — يرجع لقائمة الفصول أولاً
  if(pageStack[pageStack.length-1]==='semesters' && curSem){
    curSem=null;
    renderSemesters(document.getElementById('page-content'));
    return;
  }
  pageStack.pop();
  if(pageStack.length===0){
    document.getElementById('home').style.display='flex';
    document.getElementById('app').style.display='none';
  } else {
    renderPage(pageStack[pageStack.length-1]);
  }
}

  clearInterval(window._acadTimer);

    if(document.getElementById('page-content')&&document.getElementById('page-content').contains(document.querySelector('.stats-row'))){
      renderAcademicRecord(document.getElementById('page-content'));
    } else {
      clearInterval(window._acadTimer);
    }
  },5000);
  const c=document.getElementById('page-content');
  c.innerHTML='';
  if(page==='profile')renderProfile(c);
  else if(page==='current-sem')renderCurrentSem(c);
  else if(page==='depts')renderDepts(c);
  else if(page==='completed')renderCompleted(c);
  else if(page==='semesters')renderSemesters(c);
  else if(page==='academic-record')renderAcademicRecord(c);
  else if(page==='timetable')renderTimetable(c);
  else if(page==='exams')renderExams(c);
  else if(page==='plan')renderPlan(c);
  else if(page.startsWith('dept-')){
    const key=page.replace('dept-','');
    if(!DB.deptNames)DB.deptNames={gen:'قسم العام',net:'قسم الشبكات'};
    if(!DB.deptIcons)DB.deptIcons={};
    // تحميل من localStorage لو مو موجود في الذاكرة
    if(!DB[key])DB[key]=ld(key)||[];
    // تحديث العنوان بالاسم والأيقونة الصحيحة
    const dIcon=DB.deptIcons[key]||'📗';
    const dName=DB.deptNames[key]||key;
    document.getElementById('app-title').textContent=dIcon+' '+dName;
    renderDeptTable(c,key,dName);
  }
  else if(page==='documents')renderDocuments(c);
  else if(page==='settings')renderSettings(c);
}

function addDeptRow(key){
  openModal('➕ إضافة مقرر',deptForm({}),()=>{
    const newRow={id:Date.now(),name:gv('dr-name'),code:gv('dr-code'),units:gv('dr-units')||3,pre:gv('dr-pre')||'—',next:gv('dr-next')||'—'};
    if(!newRow.name||!newRow.name.trim()){customAlert('❌ اسم المقرر مطلوب');return;}
    // تحقق من عدم تكرار اسم المقرر أو رمزه في نفس القسم
    const dupName=(DB[key]||[]).some(r=>r.name&&r.name.trim()===newRow.name.trim());
    if(dupName){customAlert('❌ يوجد مقرر بنفس الاسم في هذا القسم');return;}
    if(newRow.code&&newRow.code.trim()){
      const dupCode=(DB[key]||[]).some(r=>r.code&&r.code.trim().toLowerCase()===newRow.code.trim().toLowerCase());
      if(dupCode){customAlert('❌ يوجد مقرر بنفس الرمز في هذا القسم');return;}
    }
    // تحقق إذا المقرر موجود في أقسام أخرى (بالاسم أو الرمز)
    const existsInOtherDept=findCourseInDepts(newRow.name);
    if(existsInOtherDept&&existsInOtherDept.deptKey!==key){
      customAlert('❌ هذا المقرر موجود مسبقاً في '+existsInOtherDept.deptName+'\nلا يمكن إضافته في أكثر من قسم');
      return;
    }
    if(newRow.code&&newRow.code.trim()){
      const codeInOtherDept=findCourseByCodeInDepts(newRow.code);
      if(codeInOtherDept&&codeInOtherDept.deptKey!==key){
        customAlert('❌ رمز المقرر "'+newRow.code+'" مستخدم مسبقاً في '+codeInOtherDept.deptName+' ('+codeInOtherDept.name+')');
        return;
      }
    }
    DB[key].push(newRow);
    sv(key,DB[key]);closeModal();window._deptRender&&window._deptRender();
    const cc=document.getElementById('dept-course-count');if(cc)cc.textContent=DB[key].length+' مقرر';
  });
}
function editDeptRow(key,i){
  const r=DB[key][i];
  openModal('✏️ تعديل مقرر',deptForm(r),()=>{
    const newName=gv('dr-name');
    const newCode=gv('dr-code');
    if(!newName||!newName.trim()){customAlert('❌ اسم المقرر مطلوب');return;}
    const dupName=(DB[key]||[]).some((x,xi)=>xi!==i&&x.name&&x.name.trim()===newName.trim());
    if(dupName){customAlert('❌ يوجد مقرر بنفس الاسم في هذا القسم');return;}
    if(newCode&&newCode.trim()){
      const dupCode=(DB[key]||[]).some((x,xi)=>xi!==i&&x.code&&x.code.trim().toLowerCase()===newCode.trim().toLowerCase());
      if(dupCode){customAlert('❌ يوجد مقرر بنفس الرمز في هذا القسم');return;}
    }
    if(newName.trim()!==(r.name||'').trim()){
      const existsInOtherDept=findCourseInDepts(newName);
      if(existsInOtherDept&&existsInOtherDept.deptKey!==key){
        customAlert('❌ هذا المقرر موجود مسبقاً في '+existsInOtherDept.deptName+'\nلا يمكن إضافته في أكثر من قسم');
        return;
      }
    }
    if(newCode&&newCode.trim()&&newCode.trim().toLowerCase()!==(r.code||'').trim().toLowerCase()){
      const codeInOtherDept=findCourseByCodeInDepts(newCode);
      if(codeInOtherDept&&codeInOtherDept.deptKey!==key){
        customAlert('❌ رمز المقرر "'+newCode+'" مستخدم مسبقاً في '+codeInOtherDept.deptName+' ('+codeInOtherDept.name+')');
        return;
      }
    }
    DB[key][i]={...r,name:newName,code:newCode,units:gv('dr-units'),pre:gv('dr-pre')||'—',next:gv('dr-next')||'—'};
    sv(key,DB[key]);closeModal();window._deptRender&&window._deptRender();
    const cc=document.getElementById('dept-course-count');if(cc)cc.textContent=DB[key].length+' مقرر';
  });
}

    <div id="dr-pre-sg" style="display:none;position:absolute;top:100%;right:0;left:0;background:var(--surface);border:1px solid var(--accent);border-radius:8px;z-index:200;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4)"></div>
  </div>
</div></div><div class="fg"><label class="fl">المقرر القادم</label><input class="fi" id="dr-next" value="${r.next||''}"></div>`;}
function drPreSg(v){
  var box=document.getElementById('dr-pre-sg');if(!box)return;
  var depts=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  var seen={};var all=[];
  Object.keys(depts).forEach(function(k){if(!DB[k]){var lv=localStorage.getItem('tdb_'+k);DB[k]=lv?JSON.parse(lv):[];}(DB[k]||[]).forEach(function(c){if(c.name&&!seen[c.name]){seen[c.name]=1;all.push(c);}});});
  var m=v?all.filter(function(c){return c.name&&c.name.indexOf(v)>=0;}).slice(0,6):all.slice(0,8);
  if(!m.length){box.style.display='none';return;}

function syncCompletedToSemester(item, oldSemNum){
  const ALL_NAMES=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون'];
  const semOrder={}; ALL_NAMES.forEach((n,i)=>semOrder[n]=i+1);
  // احذف من الفصل القديم لو تغير
  if(oldSemNum&&oldSemNum!==item.semNum){
    const oldIdx=semOrder[oldSemNum];
    if(oldIdx&&DB.semesters[oldIdx]){
      DB.semesters[oldIdx].rows=DB.semesters[oldIdx].rows.filter(r=>r.name!==item.name&&r.code!==item.code);
      sv('semesters',DB.semesters);
    }
  }
  // أضف للفصل الجديد
  const semIdx=semOrder[item.semNum];
  if(!semIdx)return;
  if(!DB.semesters[semIdx])DB.semesters[semIdx]={rows:[]};
  const exists=DB.semesters[semIdx].rows.findIndex(r=>r.name===item.name||(item.code&&r.code===item.code));
  if(exists>=0){
    // حافظ على mid و fin الموجودة وفقط حدّث الاسم والكود والوحدات والقسم
    const existing=DB.semesters[semIdx].rows[exists];
    DB.semesters[semIdx].rows[exists]={
      ...existing,
      name:item.name,
      code:item.code||existing.code||'',
      units:item.units||existing.units||3,
      dept:item.dept||existing.dept||'عام'
    };
    // فقط حدّث total لو المقرر محدد الدرجة
    if(item.grade!==null&&item.grade!==undefined){
      DB.semesters[semIdx].rows[exists].total=item.grade;
    }
  } else {
    const row={id:item.id||Date.now(),name:item.name,code:item.code||'',units:item.units||3,total:item.grade||0,dept:item.dept||'عام'};
    DB.semesters[semIdx].rows.push(row);
  }
  sv('semesters',DB.semesters);
}

function addCompleted(){openModal('➕ إضافة مقرر مكتمل',completedForm({}),()=>{
  const gradeVal=gv('cf-grade').trim();
  const grade=gradeVal===''?null:parseInt(gradeVal);
  if(grade!==null&&grade<50){customAlert('❌ لا يمكن إضافة مقرر بدرجة أقل من 50');return;}
  const newName=gv('cf-name').trim();
  const duplicate=DB.completed.some(x=>x.name.trim()===newName);
  if(duplicate){customAlert('❌ هذا المقرر موجود مسبقاً');return;}
  const preErr=checkPrereqForAdd(newName);
  if(preErr){customAlert(preErr);return;}
  const newItem={id:Date.now(),name:newName,code:gv('cf-code'),grade:grade,units:parseInt(gv('cf-units'))||3,sem:gv('cf-sem'),semNum:gv('cf-semnum'),dept:gv('cf-dept'),note:(document.getElementById('cf-note')||{}).value||''};
  // تحقق من صحة البيانات لو المقرر موجود في الأقسام
  const {course:ac,errors:ae}=validateCompletedRow(newItem);
  if(ae.length>0&&ac){
    showSaveErrorsModal(ae,()=>{
      newItem.code=ac.code;newItem.units=ac.units;
      newItem.dept=(ac.deptName||'').replace('قسم ','').replace('قسم','').trim();
      DB.completed.push(newItem);
      sv('completed',DB.completed);
      syncCompletedToSemester(newItem,null);
      closeModal();window._compRender&&window._compRender();
    });return;
  }
  const finishAddCompleted=()=>{
    DB.completed.push(newItem);
    sv('completed',DB.completed);
    syncCompletedToSemester(newItem,null);
    closeModal();window._compRender&&window._compRender();
  };
  if(!ac&&newItem.name&&newItem.name.trim()){
    customConfirm('⚠️ المقرر "'+newItem.name+'" غير موجود في الأقسام.\nهل تريد الاستمرار في الحفظ؟',finishAddCompleted);
    return;
  }
  finishAddCompleted();
});}

function getAutoStatus(startStr,endStr){
  const parseD=s=>{
    if(!s)return null;
    if(s.includes('-')){const p=s.split('-');return new Date(p[0],p[1]-1,p[2]);}
    const p=s.split('/');return p.length===3?new Date(p[2],p[1]-1,p[0]):null;
  };
  const start=parseD(startStr), end=parseD(endStr);
  if(!start||!end)return'مخطط';
  const now=new Date();now.setHours(0,0,0,0);
  if(end<now)return'مكتمل';
  if(start<=now&&end>=now)return'نشط';
  const diff=(start-now)/(1000*60*60*24);
  if(diff<=31)return'قريباً';
  return'مخطط';
}

function sortPlanByDate(plans){
  const parseD=s=>{

    const p=s.split('/');return p.length===3?new Date(p[2],p[1]-1,p[0]):new Date(9999,0,1);
  };
  return [...plans].sort((a,b)=>parseD(a.start)-parseD(b.start));
}

function autoStatusFromDates(){
  const startStr=(document.getElementById('pl-start')||{}).value;
  const endStr=(document.getElementById('pl-end')||{}).value;
  const statusEl=document.getElementById('pl-status');
  if(!startStr||!endStr||!statusEl)return;
  // Parse DD/MM/YYYY
  const parseDate=s=>{const p=s.split('/');return p.length===3?new Date(p[2],p[1]-1,p[0]):null;};
  const start=parseDate(startStr), end=parseDate(endStr);
  if(!start||!end)return;
  const now=new Date(); now.setHours(0,0,0,0);
  const thisMonth=now.getMonth(), thisYear=now.getFullYear();
  const startM=start.getMonth(), startY=start.getFullYear();
  const endM=end.getMonth(), endY=end.getFullYear();
  if(end<now) statusEl.value='انتظار';
  else if(start<=now&&end>=now) statusEl.value='نشط';
  else if(startY===thisYear&&startM===thisMonth) statusEl.value='نشط';
  else if((startY*12+startM)-(thisYear*12+thisMonth)<=1) statusEl.value='قريباً';
  else statusEl.value='مخطط';
}

function calcSemStats(){
  var rows=(DB.semesters[curSem]&&DB.semesters[curSem].rows)||[];
  var valid=rows.filter(function(r){return r.name&&r.name.trim();});
  var allU=0;
  rows.forEach(function(r){allU+=parseFloat(r.units)||0;});
  var ws=0,wu=0;
  valid.forEach(function(r){
    var u=parseFloat(r.units)||0,g=parseFloat(r.total)||0;
    ws+=g*u; wu+=u;
  });
  var avg=wu>0?(ws/wu).toFixed(2):'0.00';
  var sumG=valid.reduce(function(s,r){return s+(parseFloat(r.total)||0);},0);
  // معدل العام: ناجحين فقط، آخر درجة لكل مادة
  var courseMap={};
  for(var gi=1;gi<=curSem;gi++){
    var gr=(DB.semesters[gi]&&DB.semesters[gi].rows)||[];
    gr.filter(function(r){return r.name&&r.name.trim();}).forEach(function(r){
      var g=parseFloat(r.total)||0,u=parseFloat(r.units)||0;
      if(g>=50) courseMap[r.name]={g:g,u:u};
    });
  }
  var gws=0,gwu=0;
  Object.keys(courseMap).forEach(function(k){gws+=courseMap[k].g*courseMap[k].u;gwu+=courseMap[k].u;});
  var gen=gwu>0?(gws/gwu).toFixed(2):'0.00';
  if(curSem===1) gen=avg;
  // حفظ معدل العام للسجل الدراسي
  window._lastGenAvg=gen;
  function ss(id){return document.getElementById(id);}
  if(ss('s-units'))ss('s-units').textContent=allU;
  if(ss('s-cum'))ss('s-cum').textContent=gwu;
  if(ss('s-sum'))ss('s-sum').textContent=Math.round(sumG);
  if(ss('s-avg'))ss('s-avg').textContent=avg;
  if(ss('s-gen'))ss('s-gen').textContent=gen;
}

function findCourseInDepts(name){
  // يبحث عن مقرر في كل الأقسام، يرجع بيانات المقرر أو null
  if(!name||!name.trim())return null;
  const depts=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  for(const k of Object.keys(depts)){
    if(!DB[k]){const lv=localStorage.getItem('tdb_'+k);DB[k]=lv?JSON.parse(lv):[];}
    const found=(DB[k]||[]).find(r=>r.name&&r.name.trim()===name.trim());
    if(found)return{...found,deptKey:k,deptName:depts[k]};
  }
  return null;
}
function findCourseByCodeInDepts(code){
  // يبحث عن مقرر بنفس الرمز في كل الأقسام، يرجع بيانات المقرر أو null
  if(!code||!code.trim())return null;
  const depts=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  for(const k of Object.keys(depts)){
    if(!DB[k]){const lv=localStorage.getItem('tdb_'+k);DB[k]=lv?JSON.parse(lv):[];}
    const found=(DB[k]||[]).find(r=>r.code&&r.code.trim().toLowerCase()===code.trim().toLowerCase());
    if(found)return{...found,deptKey:k,deptName:depts[k]};
  }
  return null;
}
// يتحقق هل المتطلب السابق لمقرر معين متحقق فعلاً؛ يرجع null لو تمام، أو رسالة الخطأ لو لا
function checkPrereqForAdd(courseName){
  const course=findCourseInDepts(courseName);
  if(!course)return null; // المقرر غير موجود بالأقسام، لا داعي للتحقق
  const pre=(course.pre||'—').trim();
  if(!pre||pre==='—')return null;
  const unitMatch=pre.match(/(\d+)\s*(وحدة|وحدات|ساعة|ساعات)/);
  if(unitMatch){
    const req=parseInt(unitMatch[1]);
    const totalU=(DB.completed||[]).reduce((s,c)=>s+(parseInt(c.units)||0),0);
    if(totalU<req)return '❌ يجب اجتياز '+req+' وحدة أولاً قبل إضافة "'+courseName+'" (عندك حالياً '+totalU+' وحدة مكتملة)';
    return null;
  }
  const done=(DB.completed||[]).some(c=>c.name&&c.name.trim()===pre);
  if(!done)return '❌ يجب إكمال مقرر "'+pre+'" أولاً قبل إضافة "'+courseName+'"';
  return null;
}

function validateSemRow(r){
  // r = {name, code, units, mid, fin, total, dept}
  const course=findCourseInDepts(r.name);
  const errors=[];
  if(course){
    // المقرر موجود - تحقق من الرمز والوحدات والقسم
    if(r.code&&r.code.trim()&&r.code.trim()!==course.code)
      errors.push('⚠️ رمز المقرر خاطئ - الصحيح هو: '+course.code);
    if(r.units&&parseInt(r.units)!==parseInt(course.units))
      errors.push('⚠️ الوحدات خاطئة - الصحيح هو: '+course.units+' وحدات');
    const correctDept=(course.deptName||'').replace('قسم ','').replace('قسم','').trim();
    if(r.dept&&r.dept.trim()&&r.dept.trim()!==correctDept)
      errors.push('⚠️ القسم خاطئ - الصحيح هو: '+correctDept);
  }
  // تحقق من المجموع لو في نصفي ونهائي
  if(r.mid!==''&&r.mid!==undefined&&r.fin!==''&&r.fin!==undefined){
    const mid=parseFloat(r.mid)||0;
    const fin=parseFloat(r.fin)||0;
    const expectedTotal=mid+fin;
    if(r.total!==''&&r.total!==undefined&&Math.abs(parseFloat(r.total)-expectedTotal)>0.5)
      errors.push('⚠️ المجموع خاطئ - النصفي+النهائي = '+expectedTotal.toFixed(1));
  }
  if(r.total!==''&&r.total!==undefined){
    const t=parseFloat(r.total);
    if(isNaN(t)||t<0||t>100)
      errors.push('⚠️ المجموع يجب أن يكون بين 0 و 100');
  }
  return{course,errors};
}

function validateCompletedRow(r){

      errors.push('⚠️ القسم خاطئ - الصحيح هو: '+correctDept);
  }

}

function validateDeptRow(r,existingCourse){

// ══ اقتراحات المقررات ══
function normCourseName(s){return(s||'').trim().replace(/^ال/,'').replace(/\s+/g,'');}
function courseNamesMatch(a,b){return normCourseName(a)===normCourseName(b);}
function isElectiveCourse(course){
  return course.code==='#'||/اختياري/.test(course.name||'');
}
function getAllDeptCoursesWithMeta(){
  const depts=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  let all=[];
  Object.keys(depts).forEach(k=>{
    if(!DB[k]){const lv=localStorage.getItem('tdb_'+k);DB[k]=lv?JSON.parse(lv):[];}
    (DB[k]||[]).forEach(c=>{all.push({...c,deptKey:k,deptName:depts[k]});});
  });
  return all;
}
// يحدد رقم الفصل الحقيقي الذي أُنجز فيه مقرر مكتمل معين (بمطابقة اسم الفصل، ثم الكلمة العربية كخطة بديلة)
function getCompletedSemNumber(entry){
  for(const k of Object.keys(DB.semesters||{})){
    if(DB.semesters[k]&&DB.semesters[k].name&&DB.semesters[k].name===entry.sem)return parseInt(k);
  }
  if(entry.semNum){
    for(let k=1;k<=20;k++){
      const word=(SEM_NAMES_BASE[k]||'').replace('الفصل ','');
      if(word===entry.semNum)return k;
    }
  }
  return null; // غير معروف التوقيت
}
// هل المقرر مكتمل حتى نهاية الفصل المحدد (شامل الفصل نفسه)؟ — يُستخدم لاستبعاد المكتمل
function isCourseCompletedUpToSem(name,semNum){
  return(DB.completed||[]).some(c=>{
    if(!courseNamesMatch(c.name,name))return false;
    const cs=getCompletedSemNumber(c);
    if(cs===null)return true;
    return cs<=semNum;
  });
}
// يحدد أقرب فصل حقيقي أُنجز فيه المقرر فعلياً (أو null إذا لم يُنجز إطلاقاً بعد)
function getCourseRealCompletionSem(name){
  let best=null;
  (DB.completed||[]).forEach(c=>{
    if(!courseNamesMatch(c.name,name))return;
    let cs=getCompletedSemNumber(c);
    if(cs===null)cs=1; // توقيت غير معروف، نفترض أقرب فصل ممكن
    if(best===null||cs<best)best=cs;
  });
  return best;
}
// أصغر فصل يصبح فيه مقرر ذو متطلب (اسم مقرر) مستحقاً — أي الفصل اللي بعد فصل إكمال المتطلب فعلياً
function getPrereqSatisfiedSem(preName){
  const cs=getCourseRealCompletionSem(preName);
  if(cs===null)return null; // المتطلب لم يُكمل بعد، فلا يوجد فصل استحقاق
  return cs+1;
}
// أصغر فصل يبلغ فيه مجموع الوحدات المكتملة (بفصول أسبق فعلاً) الحد المطلوب
function getUnitsSatisfiedSem(threshold){
  const bySem={};
  (DB.completed||[]).forEach(c=>{
    let cs=getCompletedSemNumber(c);
    if(cs===null)cs=1;
    bySem[cs]=(bySem[cs]||0)+(parseInt(c.units)||0);
  });
  const maxKey=Math.max(1,...Object.keys(bySem).map(Number));
  let cum=0;
  for(let n=1;n<=maxKey+1;n++){
    if(cum>=threshold)return n;
    cum+=bySem[n]||0;
  }
  return null; // لم يتحقق الحد بعد
}
// أصغر فصل تصبح فيه المقررات الاختيارية مستحقة (بعد اكتمال كل مقررات الشبكات الإجبارية فعلياً)
function getElectiveTargetSem(){
  const netNonElective=(DB.net||[]).filter(c=>!isElectiveCourse(c));
  if(!netNonElective.length)return null;
  let maxCs=0;
  for(const c of netNonElective){
    const cs=getCourseRealCompletionSem(c.name);
    if(cs===null)return null; // مو كل مقررات الشبكات مكتملة بعد
    if(cs>maxCs)maxCs=cs;
  }
  return maxCs+1;
}
// فصل الاستحقاق النظري لمقرر معين (الفصل اللي المفروض يُؤخذ فيه)
function getTargetSemForCourse(course){
  const pre=(course.pre||'—').trim();
  const unitMatch=pre.match(/(\d+)\s*(وحدة|وحدات|ساعة|ساعات)/);
  if(unitMatch)return getUnitsSatisfiedSem(parseInt(unitMatch[1]));
  if(isElectiveCourse(course))return getElectiveTargetSem();
  if(!pre||pre==='—')return 1;
  return getPrereqSatisfiedSem(pre);
}
// يفحص كل تسجيلات مقرر معين بكل الفصول: هل راسب بنفس الفصل الحالي؟ وهل عنده تسجيل نشط (بدون درجة) بأي فصل؟
function scanCourseRegistrations(name){
  let failedThisSem=false,hasActiveRow=false;
  Object.keys(DB.semesters||{}).forEach(k=>{
    const rows=(DB.semesters[k]&&DB.semesters[k].rows)||[];
    rows.forEach(r=>{
      if(!courseNamesMatch(r.name,name))return;
      const hasGrade=r.total!==undefined&&r.total!==null&&String(r.total).trim()!=='';
      const t=parseFloat(r.total)||0;
      if(hasGrade&&t<50&&String(k)===String(curSem))failedThisSem=true;
      if(!hasGrade)hasActiveRow=true;
    });
  });
  return{failedThisSem,hasActiveRow};
}
function getSuggestedCourses(){
  const allCourses=getAllDeptCoursesWithMeta();
  const suggestions=[];
  allCourses.forEach(course=>{
    if(!course.name||!course.name.trim())return;
    const targetSem=getTargetSemForCourse(course);
    if(targetSem===null||curSem<targetSem)return; // لم يستحق بعد
    const realCompSem=getCourseRealCompletionSem(course.name);
    const{failedThisSem,hasActiveRow}=scanCourseRegistrations(course.name);
    if(failedThisSem){
      // راسب بنفس هذا الفصل بالذات: يظهر دائماً هنا، حتى لو اتكمل لاحقاً بفصل ثاني
      suggestions.push({...course,status:'failed'});
    }else if(realCompSem!==null){
      // مكتمل فعلياً: يظهر بوسم مكتمل في فصل الاستحقاق النظري وفي الفصل الحقيقي لإكماله (لو كانا مختلفين، يظهر بكليهما)
      if(curSem===targetSem||curSem===realCompSem){
        suggestions.push({...course,status:'completed'});
      }
    }else{
      // لم يُكمل بنجاح بعد: نشط (مسجل بدون درجة) بأي فصل، أو متاح للإضافة
      suggestions.push({...course,status:hasActiveRow?'active':'available'});
    }
  });
  return suggestions;
}
function openSuggestions(){
  const list=getSuggestedCourses();
  const html=list.length?`<div style="display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto">
    ${list.map(c=>{
      const safeName=c.name.replace(/'/g,"\\'");
      const units=parseInt(c.units)||3;
      const next=c.next&&c.next.trim()?c.next:'—';
      const actionHtml=c.status==='completed'
        ?`✅ مكتمل`
        :c.status==='failed'
        ?`❌ غير مكتمل`
        :c.status==='active'
        ?`🔵 نشط`
        :`➕ إضافة`;
      const actionStyle=c.status==='completed'
        ?'background:rgba(46,213,115,.15);color:#2ed573'
        :c.status==='failed'
        ?'background:rgba(245,87,108,.15);color:#f5576c'
        :c.status==='active'
        ?'background:rgba(84,160,255,.15);color:#54a0ff'
        :'background:var(--accent);color:#fff;cursor:pointer';
      const isButton=c.status!=='completed'&&c.status!=='failed'&&c.status!=='active';
      const actionTag=isButton
        ?`<button onclick="addSuggestedCourse('${safeName}','${c.code||''}',${units},'${(c.deptName||'').replace('قسم ','').replace('قسم','').trim()}')" style="${actionStyle};border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;flex-shrink:0">${actionHtml}</button>`
        :`<span style="${actionStyle};border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;flex-shrink:0;white-space:nowrap">${actionHtml}</span>`;
      return`<div id="sg-item-${encodeURIComponent(c.name)}" style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;color:var(--text);font-size:14px;margin-bottom:4px">${c.name}</div>
          <div style="font-size:12px;color:var(--text2);white-space:nowrap;overflow-x:auto">${c.deptName} - الوحدات: ${units} - المقرر القادم: ${next}</div>
        </div>
        <span id="sg-action-${encodeURIComponent(c.name)}">${actionTag}</span>
      </div>`;
    }).join('')}
  </div>`:`<div style="text-align:center;padding:30px;color:var(--text2)">لا توجد مقررات مستحقة لهذا الفصل حالياً</div>`;
  openModal('💡 المقترحات لهذا الفصل',html,()=>closeModal());
}
function addSuggestedCourse(name,code,units,dept){
  if(!DB.semesters[curSem])DB.semesters[curSem]={rows:[]};
  if(!DB.semesters[curSem].rows)DB.semesters[curSem].rows=[];
  if(DB.semesters[curSem].rows.some(x=>x.name===name)){customAlert('❌ هذا المقرر مضاف مسبقاً لهذا الفصل');return;}
  DB.semesters[curSem].rows.push({name,code,mid:'',fin:'',total:'',units,dept});
  sv('semesters',DB.semesters);
  renderSemCards();calcSemStats();
  const actionEl=document.getElementById('sg-action-'+encodeURIComponent(name));
  if(actionEl)actionEl.innerHTML='<span style="background:rgba(84,160,255,.15);color:#54a0ff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;flex-shrink:0;white-space:nowrap">🔵 نشط</span>';
}

function renderAcademicRecord(c){
  document.getElementById('topbar-actions').innerHTML='';
  // حساب من الفصول
  var lastSem=0;
  var maxSem=DB.semCount||10;
  for(var i=1;i<=maxSem;i++){
    if((DB.semesters[i]&&DB.semesters[i].rows||[]).filter(function(r){return r.name&&r.name.trim();}).length>0) lastSem=i;
  }
  // معدل العام من آخر فصل مكتمل
  var courseMap={};
  for(var gi=1;gi<=Math.max(lastSem,1);gi++){
    var gr=(DB.semesters[gi]&&DB.semesters[gi].rows)||[];
    gr.filter(function(r){return r.name&&r.name.trim();}).forEach(function(r){
      var g=parseFloat(r.total)||0,u=parseFloat(r.units)||0;
      if(g>=50) courseMap[r.name]={g:g,u:u};
    });
  }
  var gws=0,gwu=0;
  Object.keys(courseMap).forEach(function(k){gws+=courseMap[k].g*courseMap[k].u;gwu+=courseMap[k].u;});
  var genAvg=gwu>0?(gws/gwu).toFixed(2):'0.00';
  if(lastSem===1){
    var r1=(DB.semesters[1]&&DB.semesters[1].rows)||[];
    var v1=r1.filter(function(r){return r.name&&r.name.trim();});
    var ws1=0,wu1=0;
    v1.forEach(function(r){var u=parseFloat(r.units)||0,g=parseFloat(r.total)||0;ws1+=g*u;wu1+=u;});
    if(wu1>0) genAvg=(ws1/wu1).toFixed(2);
  }
  // إحصاءات
  var passCount=Object.keys(courseMap).length;
  var failCount=0;
  var maxSem2=DB.semCount||10;
  for(var fi=1;fi<=maxSem2;fi++){
    var fr=(DB.semesters[fi]&&DB.semesters[fi].rows)||[];
    fr.forEach(function(r){
      var hasGrade=r.total!==undefined&&r.total!==null&&String(r.total).trim()!=='';
      if(r.name&&r.name.trim()&&hasGrade&&(parseFloat(r.total)||0)<50)failCount++;
    });
  }
  var m=DB.academicManual||{};
  // حساب الوحدات الكلية تلقائياً دائماً من الأقسام
  var deptNm2=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  Object.keys(deptNm2).forEach(function(k){if(!DB[k]){var lv=localStorage.getItem('tdb_'+k);DB[k]=lv?JSON.parse(lv):[];}});
  var autoUnits=Object.keys(deptNm2).reduce(function(sum,k){return sum+(DB[k]||[]).reduce(function(s,r){return s+(parseFloat(r.units)||0);},0);},0);
  var totalSem=DB.semCount||m.totalSem||8;
  var totalUnits=autoUnits>0?autoUnits:(m.totalUnits||138);
  var totalCoursesCount=Object.keys(deptNm2).reduce(function(sum,k){return sum+(DB[k]||[]).length;},0);
  var remainingUnits=Math.max(totalUnits-gwu,0);
  var remainingCourses=Math.max(totalCoursesCount-passCount,0);
  // حساب عدد الإنذارات: يُحسب فقط لو كل مقررات الفصل مكتوب لها درجة (فصل مكتمل التقييم بالكامل)، ومعدله أقل من 50
  var warningsCount=0;
  for(var wi=1;wi<=lastSem;wi++){
    var wr=(DB.semesters[wi]&&DB.semesters[wi].rows||[]).filter(function(r){return r.name&&r.name.trim();});
    if(!wr.length)continue;
    var allGraded=wr.every(function(r){return r.total!==undefined&&r.total!==null&&String(r.total).trim()!=='';});
    if(!allGraded)continue; // لسا فيه مقرر بدون درجة، لا يُحسب كإنذار
    var wws=0,wwu=0;
    wr.forEach(function(r){var u=parseFloat(r.units)||0,g=parseFloat(r.total)||0;wws+=g*u;wwu+=u;});
    var wAvg=wwu>0?(wws/wwu):0;
    if(wAvg<50)warningsCount++;
  }
  var comp=DB.completed||[];
  var deptNm=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  var deptColors2=['var(--green)','var(--blue)','var(--accent)','#f9ca24','#ff6b6b','#4ecdc4'];
  var deptTotals=m.deptTotals||{};
  var deptProgressHtml=Object.entries(deptNm).map(function(e,i){
    var k=e[0],v=e[1];
    var shortName=v.replace('قسم ','').replace('قسم','').trim();
    var done=comp.filter(function(r){return r.dept===shortName;}).length;
    var deptCourses=(DB[k]||[]).length;
    var total=deptTotals[k]||deptCourses||0;
    var color=deptColors2[i%deptColors2.length];
    var pct=total>0?Math.min(done/total*100,100).toFixed(0):done>0?100:0;
    return '<div class="progress-item"><div class="progress-item-top"><span>'+v+'</span><span style="color:'+color+';font-weight:700">'+done+(total>0?' / '+total:'')+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  }).join('');
  c.innerHTML=
    '<div class="stats-row">'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--accent2)">'+(lastSem||0)+' / '+(totalSem||DB.semCount||8)+'</div><div class="stat-box-label">الفصول</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--accent)">'+genAvg+'</div><div class="stat-box-label">المعدل العام</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--green)">'+passCount+'</div><div class="stat-box-label">المقررات المكتملة</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--accent2)">'+remainingCourses+'</div><div class="stat-box-label">المقررات المتبقية</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--yellow)">'+gwu+'</div><div class="stat-box-label">الوحدات المكتملة</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--yellow)">'+remainingUnits+'</div><div class="stat-box-label">الوحدات المتبقية</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--red)">'+failCount+'</div><div class="stat-box-label">مرات الرسوب</div></div>'+
    '<div class="stat-box"><div class="stat-box-val" style="color:var(--red)">'+warningsCount+'</div><div class="stat-box-label">عدد الإنذارات</div></div>'+
    '</div>'+
    '<div class="section-hdr">نسبة الإنجاز</div>'+
    '<div>'+
    '<div class="progress-item"><div class="progress-item-top"><span>الوحدات</span><span style="color:var(--accent);font-weight:700">'+gwu+' / <span id="acad-total-units">'+totalUnits+'</span></span></div><div class="progress-bar"><div class="progress-fill" id="acad-units-bar" style="width:'+Math.min(gwu/totalUnits*100,100).toFixed(0)+'%"></div></div></div>'+
    deptProgressHtml+
    '</div>';
}

function lookupCourse(name){
  const dpts=DB.deptNames||{gen:'قسم العام',net:'قسم الشبكات'};
  const all=Object.keys(dpts).flatMap(k=>DB[k]||[]);
  const found=all.find(r=>r.name&&r.name.trim()===name.trim());
  return found||null;
}

function compressImage(file, maxW, quality, cb){
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    const w=Math.min(img.width,maxW);
    const h=img.height*(w/img.width);
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    cb(canvas.toDataURL('image/jpeg',quality));
  };
  img.src=url;
}

function previewUniPhoto(input,which){
  const f=input.files[0];if(!f)return;

}

let recognition=null,isRecording=false,_voiceTarget=null;
function startVoice(targetId,btn){
  if(isRecording){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){customAlert('⚠️ استخدم Chrome أو Edge للكتابة الصوتية');return;}
  recognition=new SR();
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  const el=document.getElementById(targetId);
  // اختيار اللغة تلقائياً
  const isAr=document.documentElement.lang==='ar'||(el&&(el.dir==='rtl'||el.lang==='ar'));
  recognition.lang=isAr?'ar-SA':'en-US';
  _voiceTarget=targetId;
  let interim='';
  let originalVal=el?el.value:'';
  recognition.onstart=()=>{
    isRecording=true;
    if(btn){btn.style.background='var(--red)';btn.style.color='#fff';btn.textContent='⏹️';}
    if(el){originalVal=el.value;}
  };
  recognition.onresult=e=>{
    let finalText='';interim='';
    Array.from(e.results).forEach(r=>{
      if(r.isFinal)finalText+=r[0].transcript;
      else interim+=r[0].transcript;
    });
    if(el){
      el.value=originalVal+(originalVal&&(finalText||interim)?' ':'')+finalText+interim;
      if(finalText)originalVal=el.value;
    }
  };
  recognition.onerror=e=>{
    stopVoice();
    if(e.error==='not-allowed')customAlert('❌ اسمح للمتصفح بالوصول للميكروفون');
    else if(e.error!=='no-speech')customAlert('خطأ: '+e.error);
  };
  recognition.onend=()=>{
    if(isRecording){
      // إعادة التشغيل تلقائياً للاستمرار
      try{recognition.start();}catch(e){stopVoice();}
    }
  };
  recognition.start();
}
function stopVoice(){
  isRecording=false;
  document.querySelectorAll('.mic-v-btn').forEach(b=>{b.style.background='';b.style.color='';b.textContent='🎙️';});
  if(recognition){try{recognition.abort();}catch(e){}recognition=null;}
}
function micBtn(id){return `<button class="mic-v-btn btn btn-ghost btn-sm" onclick="startVoice('${id}',this)" title="كتابة صوتية" style="padding:5px 8px">🎙️</button>`;}

let hwTarget=null,hwStrokes=[],hwCtx=null,hwDrawing=false;
function openHW(targetId){
  hwTarget=targetId;hwStrokes=[];
  document.getElementById('hw-modal').classList.add('open');
  setTimeout(initHWCanvas,100);
}
function initHWCanvas(){
  const canvas=document.getElementById('hw-canvas');
  if(!canvas)return;
  canvas.width=canvas.offsetWidth*2;canvas.height=220*2;
  canvas.style.height='220px';
  hwCtx=canvas.getContext('2d');hwCtx.scale(2,2);
  hwCtx.fillStyle='#ffffff';hwCtx.fillRect(0,0,canvas.width,canvas.height);
  hwCtx.strokeStyle='#1a1a2e';hwCtx.lineWidth=3;hwCtx.lineCap='round';hwCtx.lineJoin='round';
  // guide lines
  hwCtx.strokeStyle='#eee';hwCtx.lineWidth=1;
  for(let y=40;y<220;y+=40){hwCtx.beginPath();hwCtx.moveTo(0,y);hwCtx.lineTo(canvas.offsetWidth,y);hwCtx.stroke();}
  hwCtx.strokeStyle='#1a1a2e';hwCtx.lineWidth=3;
  const getP=(e,c)=>{const r=c.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left),y:(src.clientY-r.top)};};
  canvas.onmousedown=canvas.ontouchstart=e=>{e.preventDefault();hwDrawing=true;const p=getP(e,canvas);hwCtx.beginPath();hwCtx.moveTo(p.x,p.y);hwStrokes.push([p]);};
  canvas.onmousemove=canvas.ontouchmove=e=>{if(!hwDrawing)return;e.preventDefault();const p=getP(e,canvas);hwCtx.lineTo(p.x,p.y);hwCtx.stroke();hwStrokes[hwStrokes.length-1].push(p);};
  canvas.onmouseup=canvas.ontouchend=()=>{hwDrawing=false;};
}
function clearHW(){hwStrokes=[];initHWCanvas();}
function insertHW(){
  const txt=document.getElementById('hw-result').textContent;
  if(hwTarget&&txt&&txt!=='ستظهر النتيجة هنا...'){
    const el=document.getElementById(hwTarget);
    if(el)el.value=(el.value?el.value+' ':'')+txt;
  }
  document.getElementById('hw-modal').classList.remove('open');
}
async function recognizeHW(){
  document.getElementById('hw-status').textContent='⏳ جاري التعرف...';
  document.getElementById('hw-result').textContent='';
  const canvas=document.getElementById('hw-canvas');
  if(!hwStrokes||hwStrokes.length===0){
    document.getElementById('hw-status').textContent='⚠️ ارسم شيئاً أولاً';return;
  }
  try{
    if(typeof Tesseract==='undefined'){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';
        s.onload=res;s.onerror=()=>{
          // Fallback to older version
          const s2=document.createElement('script');
          s2.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
          s2.onload=res;s2.onerror=rej;document.head.appendChild(s2);
        };
        document.head.appendChild(s);
      });
    }
    const lang=document.getElementById('hw-lang').value;
    const worker=await Tesseract.createWorker(lang);
    const r=await worker.recognize(canvas);
    await worker.terminate();
    const txt=r.data.text.trim();
    document.getElementById('hw-result').textContent=txt||'⚠️ لم يتم التعرف على الخط';
    document.getElementById('hw-status').textContent=txt?'✅ تم التعرف':'⚠️ حاول مرة أخرى';
  }catch(e){
    document.getElementById('hw-status').textContent='❌ خطأ في التعرف';
    console.error('HW error:',e);
  }
}

function exportData(){
  const keys=['profile','timetable','exams','plan','completed','gen','net','semesters','uniInfo','academicManual','documents','albums'];
  const data={};
  keys.forEach(k=>{
    try{const v=localStorage.getItem('tdb_'+k);if(v)data[k]=JSON.parse(v);}catch(e){}
  });
  data._exported=new Date().toLocaleString('ar');

  // نضم ملفات الميديا من IndexedDB
  const docs=data.documents||[];
  const mediaIds=docs.filter(d=>d.idbId).map(d=>d.idbId);

  if(!mediaIds.length){
    _downloadJSON(data);
    return;
  }

  // نقرأ كل ملف من IDB ونحوله base64
  let loaded=0;
  data._media={};
  mediaIds.forEach(id=>{
    loadMediaBlob(id).then(url=>{
      if(url){
        // url هو objectURL — نقرأه كـ base64
        fetch(url).then(r=>r.blob()).then(blob=>{
          const rd=new FileReader();
          rd.onload=ev=>{
            data._media[id]=ev.target.result;
            loaded++;
            if(loaded===mediaIds.length)_downloadJSON(data);
          };
          rd.readAsDataURL(blob);
        }).catch(()=>{loaded++;if(loaded===mediaIds.length)_downloadJSON(data);});
      }else{loaded++;if(loaded===mediaIds.length)_downloadJSON(data);}
    }).catch(()=>{loaded++;if(loaded===mediaIds.length)_downloadJSON(data);});
  });
}

function _downloadJSON(data){
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='بياناتي_'+new Date().toLocaleDateString('ar').replace(/\//g,'-')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  customAlert('✅ تم تصدير البيانات بنجاح');
}

function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const keys=['profile','timetable','exams','plan','completed','gen','net','semesters','uniInfo','academicManual','documents','albums'];
      keys.forEach(k=>{
        if(data[k]!==undefined){
          try{
            localStorage.setItem('tdb_'+k,JSON.stringify(data[k]));
            sessionStorage.setItem('tdb_'+k,JSON.stringify(data[k]));
          }catch(e){}
        }
      });

      // استعادة ملفات الميديا في IndexedDB
      const media=data._media||{};
      const mediaKeys=Object.keys(media);
      let restored=0;
      const finish=()=>{
        restored++;
        if(restored>=mediaKeys.length||!mediaKeys.length) _reloadDB();
      };
      if(!mediaKeys.length){_reloadDB();return;}
      mediaKeys.forEach(id=>{
        // base64 → blob → IDB
        fetch(media[id]).then(r=>r.blob()).then(blob=>{
          const file=new File([blob],id,{type:blob.type});
          saveMediaBlob(id,file).then(finish).catch(finish);
        }).catch(finish);
      });
    }catch(ex){customAlert('❌ خطأ في الاستيراد: '+ex.message);}
  };
  r.readAsText(f);
}

function uploadDocs(input){
  if(!DB.documents)DB.documents=[];
  const files=Array.from(input.files);
  if(!files.length)return;
  let done=0;
  const total=files.length;

  let progressBar=document.getElementById('upload-progress');
  if(!progressBar){
    progressBar=document.createElement('div');
    progressBar.id='upload-progress';
    progressBar.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 20px;z-index:200;min-width:220px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;color:var(--text)';
    document.body.appendChild(progressBar);
  }
  progressBar.innerHTML=`⏳ جاري رفع 0 / ${total}...`;

  const finish=()=>{
    done++;
    progressBar.innerHTML=done===total
      ?`✅ تم رفع ${total} ملف بنجاح`
      :`⏳ جاري رفع ${done} / ${total}...`;
    if(done===total){
      sv('documents',DB.documents);
      window._docsRender&&window._docsRender();
      setTimeout(()=>{if(progressBar.parentNode)progressBar.remove();},2000);
    }
  };

  files.forEach(f=>{
    const type=f.type.startsWith('image')?'image'
      :(f.type.includes('pdf')||f.name.toLowerCase().endsWith('.pdf'))?'pdf'
      :(f.name.toLowerCase().match(/\.(xlsx?|xls)$/))?'excel'
      :(f.name.toLowerCase().match(/\.(docx?|doc)$/))?'word'
      :f.type.startsWith('video')?'video'
      :f.type.startsWith('audio')?'audio':'other';

    if(type==='image'){
      compressImage(f,800,0.75,data=>{
        DB.documents.push({name:f.name,type:'image',data,date:new Date().toLocaleDateString('ar')});
        finish();
      });

    } else if(type==='audio'){
      // حفظ في IndexedDB كـ blob مباشرة
      const id='audio_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      saveMediaBlob(id,f).then(()=>{
        DB.documents.push({name:f.name,type:'audio',idbId:id,date:new Date().toLocaleDateString('ar')});
        finish();
      }).catch(()=>{
        // fallback: base64 للملفات الصغيرة فقط
        if(f.size<5*1024*1024){
          const r=new FileReader();
          r.onload=e=>{DB.documents.push({name:f.name,type:'audio',data:e.target.result,date:new Date().toLocaleDateString('ar')});finish();};
          r.onerror=()=>finish();
          r.readAsDataURL(f);
        }else{
          customAlert('الملف كبير جداً — حاول مع ملف أصغر');finish();
        }
      });

    } else if(type==='video'){
      const id='video_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      const blobUrl=URL.createObjectURL(f);
      const v=document.createElement('video');
      v.muted=true;v.playsInline=true;v.preload='metadata';v.src=blobUrl;
      let saved=false;
      const saveVideo=(thumb)=>{
        if(saved)return;saved=true;
        URL.revokeObjectURL(blobUrl);v.src='';v.onloadedmetadata=null;v.onseeked=null;v.onerror=null;
        saveMediaBlob(id,f).then(()=>{
          DB.documents.push({name:f.name,type:'video',idbId:id,thumb,date:new Date().toLocaleDateString('ar')});
          finish();
        }).catch(()=>{
          DB.documents.push({name:f.name,type:'video',idbId:id,thumb,date:new Date().toLocaleDateString('ar')});
          finish();
        });
      };
      v.onloadedmetadata=()=>{v.currentTime=0.5;};
      v.onseeked=()=>{
        try{
          const cv=document.createElement('canvas');
          cv.width=Math.min(v.videoWidth||320,320);
          cv.height=Math.round(cv.width*(v.videoHeight||240)/(v.videoWidth||320));
          cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
          saveVideo(cv.toDataURL('image/jpeg',0.5));
        }catch(e){saveVideo(null);}
      };
      v.onerror=()=>saveVideo(null);
      setTimeout(()=>{if(!saved)saveVideo(null);},5000);
      v.load();

    } else {
      const reader=new FileReader();
      reader.onload=e=>{
        DB.documents.push({name:f.name,type,data:e.target.result,date:new Date().toLocaleDateString('ar')});
        finish();
      };
      reader.onerror=()=>finish();
      reader.readAsDataURL(f);
    }
  });
}

function viewDoc(i){
  var d=DB.documents[i];if(!d)return;

  // الفيديو يستخدم blobUrl
  if(d.type==='video'){
    const show=(src)=>{
      if(!src){customAlert('أعد رفع الفيديو');return;}
      const ov5=_makeOv(d.name||'فيديو','#000');
      const vid2=document.createElement('video');
      vid2.src=src;vid2.controls=true;vid2.autoplay=true;vid2.playsInline=true;
      vid2.style.cssText='flex:1;width:100%;max-height:100%;background:#000';
      ov5.body.appendChild(vid2);
      document.body.appendChild(ov5.el);
    };
    if(d.idbId){loadMediaBlob(d.idbId).then(url=>show(url));}
    else show(d.data||null);
    return;
  }

  if(d.type==='audio'){
    const play=(src)=>{
      if(!src){customAlert('أعد رفع الملف الصوتي');return;}
      const ov6=document.createElement('div');
      ov6.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px';
      ov6.innerHTML=`<div style="color:#fff;font-size:40px">🎵</div>
        <div style="color:#fff;font-size:14px;font-weight:700;max-width:80vw;text-align:center">${d.name||'تشغيل'}</div>
        <audio controls autoplay src="${src}" style="max-width:90vw"></audio>
        <button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;margin-top:8px">إغلاق</button>`;
      document.body.appendChild(ov6);
    };
    if(d.idbId){loadMediaBlob(d.idbId).then(url=>play(url));}
    else play(d.data||null);
    return;
  }

  var data=d.data||(d.objId&&window._docFiles?window._docFiles[d.objId]:null);
  if(!data){customAlert('أعد رفع الملف');return;}

  // ── صورة ──
  if(d.type==='image'){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center';
    ov.onclick=function(){document.body.removeChild(ov);};
    var img=document.createElement('img');
    img.src=data;img.style.cssText='max-width:100%;max-height:100%;object-fit:contain';
    img.onclick=function(e){e.stopPropagation();};
    var cb=document.createElement('button');
    cb.textContent='✕';cb.style.cssText='position:absolute;top:12px;right:12px;background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer';
    cb.onclick=function(e){e.stopPropagation();document.body.removeChild(ov);};
    ov.appendChild(img);ov.appendChild(cb);document.body.appendChild(ov);
    return;
  }

  // ── PDF: عرض باستخدام PDF.js (يعمل في كل المتصفحات) ──
  if(d.type==='pdf'){
    try{
      var bin=atob(data.split(',')[1]);
      var pdfBuf=new Uint8Array(bin.length);
      for(var j=0;j<bin.length;j++) pdfBuf[j]=bin.charCodeAt(j);
      var ovPdf=_makeOv(d.name||'PDF','#1a1a2e');
      ovPdf.body.style.overflow='auto';
      ovPdf.body.style.padding='12px';
      ovPdf.body.style.alignItems='center';
      var loadingDiv=document.createElement('div');
      loadingDiv.style.cssText='color:#fff;text-align:center;padding:30px;font-size:14px';
      loadingDiv.textContent='⏳ جاري تحميل PDF...';
      ovPdf.body.appendChild(loadingDiv);
      document.body.appendChild(ovPdf.el);
      var renderPDF=function(pdfjsLib){
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
        var loadingTask=pdfjsLib.getDocument({data:pdfBuf});
        loadingTask.promise.then(function(pdf){
          ovPdf.body.innerHTML='';
          var pageCount=pdf.numPages;
          var counter=document.createElement('div');
          counter.style.cssText='color:rgba(255,255,255,.6);font-size:12px;text-align:center;padding:4px 0 8px;flex-shrink:0';
          counter.textContent='📄 '+pageCount+' صفحة';
          ovPdf.body.appendChild(counter);
          var canvasWrap=document.createElement('div');
          canvasWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:20px';
          ovPdf.body.appendChild(canvasWrap);
          for(var pn=1;pn<=pageCount;pn++){
            (function(pageNum){
              pdf.getPage(pageNum).then(function(page){
                var vp=page.getViewport({scale:1.5});
                var canvas=document.createElement('canvas');
                canvas.width=vp.width; canvas.height=vp.height;
                canvas.style.cssText='max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,.5);border-radius:4px;background:#fff';
                canvasWrap.appendChild(canvas);
                page.render({canvasContext:canvas.getContext('2d'),viewport:vp});
              });
            })(pn);
          }
        }).catch(function(err){
          ovPdf.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px">❌ تعذر فتح PDF: '+err.message+'</div>';
        });
      };
      if(window._pdfjsLibCache){renderPDF(window._pdfjsLibCache);}
      else{
        import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs').then(function(mod){
          window._pdfjsLibCache=mod;
          renderPDF(mod);
        }).catch(function(){
          ovPdf.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px">❌ تعذر تحميل PDF.js</div>';
        });
      }
    }catch(e){customAlert('تعذر فتح PDF: '+e.message);}
    return;
  }

  // ── Excel: عرض داخل التطبيق باستخدام SheetJS ──
  if(d.type==='excel'){
    try{
      var ov2=_makeOv(d.name||'Excel','#1d2030');
      ov2.body.style.overflow='auto';
      ov2.body.style.padding='12px';
      ov2.body.innerHTML='<div style="color:#fff;text-align:center;padding:30px;font-size:14px">⏳ جاري تحميل الجدول...</div>';
      document.body.appendChild(ov2.el);
      var loadXLSX=function(){
        var bin=atob(data.split(',')[1]);
        var buf=new Uint8Array(bin.length);
        for(var j=0;j<bin.length;j++) buf[j]=bin.charCodeAt(j);
        var wb=XLSX.read(buf,{type:'array'});
        var html='';
        wb.SheetNames.forEach(function(sn,si){
          var ws=wb.Sheets[sn];
          var sheetHtml=XLSX.utils.sheet_to_html(ws,{id:'xlsx-sheet-'+si,editable:false});
          html+='<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;padding:4px 10px;background:rgba(108,99,255,.15);border-radius:6px;display:inline-block">📊 '+sn+'</div>'+sheetHtml+'</div>';
        });
        ov2.body.innerHTML='<style>.xlsx-tbl table{border-collapse:collapse;min-width:100%;font-size:12px;color:#eee}.xlsx-tbl td,.xlsx-tbl th{border:1px solid #2f3347;padding:6px 10px;white-space:nowrap}.xlsx-tbl tr:nth-child(even){background:rgba(255,255,255,.04)}.xlsx-tbl tr:first-child td,.xlsx-tbl tr:first-child th{background:#252839;font-weight:700}</style><div class="xlsx-tbl">'+html+'</div>';
        // تطبيق الستايل على جميع الجداول الناتجة
        ov2.body.querySelectorAll('table').forEach(function(t){t.style.borderCollapse='collapse';});
      };
      if(typeof XLSX!=='undefined'){loadXLSX();}
      else{
        var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=loadXLSX;
        s.onerror=function(){ov2.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px">❌ تعذر تحميل مكتبة Excel</div>';};
        document.head.appendChild(s);
      }
    }catch(e){customAlert('تعذر فتح Excel: '+e.message);}
    return;
  }

  // ── Word: عرض داخل التطبيق باستخدام mammoth ──
  if(d.type==='word'){
    try{
      var ov3=_makeOv(d.name||'Word','#1a2036');
      ov3.body.style.overflow='auto';
      ov3.body.innerHTML='<div style="color:#fff;text-align:center;padding:30px;font-size:14px">⏳ جاري تحميل المستند...</div>';
      document.body.appendChild(ov3.el);
      var loadMammoth=function(){
        var bin=atob(data.split(',')[1]);
        var buf=new Uint8Array(bin.length);
        for(var j=0;j<bin.length;j++) buf[j]=bin.charCodeAt(j);
        mammoth.convertToHtml({arrayBuffer:buf.buffer}).then(function(result){
          ov3.body.innerHTML='<div style="background:#fff;color:#111;padding:32px;max-width:820px;margin:0 auto;min-height:100%;font-family:Arial,Tahoma,sans-serif;font-size:14px;line-height:1.7;direction:rtl">'+result.value+'</div>';
        }).catch(function(err){
          ov3.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px">❌ تعذر فتح المستند</div>';
        });
      };
      if(typeof mammoth!=='undefined'){loadMammoth();}
      else{
        var sm=document.createElement('script');
        sm.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
        sm.onload=loadMammoth;
        sm.onerror=function(){ov3.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px">❌ تعذر تحميل مكتبة Word</div>';};
        document.head.appendChild(sm);
      }
    }catch(e){customAlert('تعذر فتح Word: '+e.message);}
    return;
  }

  // ── صوت وفيديو ──
  try{
    var mime2;
    if(d.type==='audio'){mime2='audio/mpeg';}
    else if(d.type==='video'){
      mime2=d.mimeType||'video/mp4';
    } else {mime2='application/octet-stream';}
    var ov5=_makeOv(d.name||'ملف','#000');
    if(d.type==='video'){
      var srcUrl=d.blobUrl||data;
      var vid2=document.createElement('video');
      vid2.src=srcUrl;vid2.controls=true;vid2.autoplay=true;
      vid2.style.cssText='flex:1;width:100%;max-height:100%;background:#000';
      vid2.onerror=function(){
        // بعد إغلاق الصفحة قد يبطل blob URL - نحاول base64 إذا كان موجوداً
        if(d.data){vid2.src=d.data;}
        else{ov5.body.innerHTML='<div style="color:#f5576c;text-align:center;padding:30px;margin:auto">❌ تعذر تشغيل الفيديو<br><small style="color:#7b82a0">جرب إعادة رفع الملف</small></div>';}
      };
      ov5.body.appendChild(vid2);
    } else {
      var srcUrlA=data;
      var aud2=document.createElement('audio');aud2.src=srcUrlA;aud2.controls=true;
      aud2.style.cssText='width:90%;margin:auto';ov5.body.style.alignItems='center';ov5.body.appendChild(aud2);
    }
    document.body.appendChild(ov5.el);
  }catch(e){customAlert('تعذر فتح الملف: '+e.message);}
}

function _b64Blob(b64,mime){
  var bin=atob(b64.split(',')[1]);
  var buf=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) buf[j]=bin.charCodeAt(j);
  return new Blob([buf],{type:mime});
}

function _makeOv(title,bg,onClose){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;background:'+(bg||'#000');
  var bar=document.createElement('div');
  bar.style.cssText='background:rgba(0,0,0,.5);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:46px';
  var ttl=document.createElement('span');
  ttl.style.cssText='color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%';
  ttl.textContent=title||'';
  var cb=_closeBtn(function(){document.body.removeChild(el);if(onClose)onClose();});
  bar.appendChild(ttl); bar.appendChild(cb); el.appendChild(bar);
  var body=document.createElement('div');
  body.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden';
  el.appendChild(body);
  return {el:el,body:body};
}

function _closeBtn(fn){
  var b=document.createElement('button');
  b.innerHTML='✕ إغلاق';
  b.style.cssText='background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:Tajawal,sans-serif;white-space:nowrap';

function checkPasswordGate(cb){
  // إصلاح apppass لو كان متحفظ بشكل خاطئ (مع JSON quotes)
  let stored=localStorage.getItem('tdb_apppass');
  if(stored&&stored.startsWith('"')&&stored.endsWith('"')){
    stored=JSON.parse(stored);
    localStorage.setItem('tdb_apppass',stored);
  }
  // نعرض واجهة كلمة المرور فوراً بدون أي انتظار
  const state={pass:stored,loggedIn:false};
  showSplashGate(state, cb);
  // نتأكد من كلمة المرور المحدثة من السحابة بالخلفية (لا يؤخر ظهور الواجهة)
  try{
    if(typeof db!=='undefined'&&typeof CLOUD_DOC!=='undefined'){
      db.collection('tdb').doc(CLOUD_DOC).get().then(snap=>{
        if(state.loggedIn)return; // المستخدم دخل مسبقاً، لا داعي للتحديث
        const hadPass=!!state.pass;
        if(snap&&snap.exists){
          const cloudData=JSON.parse(snap.data().value);
          if(cloudData.apppass){
            state.pass=cloudData.apppass;
            localStorage.setItem('tdb_apppass',cloudData.apppass);
          }else if(cloudData.apppass===''){
            state.pass=null;
            localStorage.removeItem('tdb_apppass');
          }
        }
        // لو تغيرت حالة وجود كلمة المرور (ظهرت متأخرة) وما زالت الشاشة مفتوحة، نعيد رسمها لإظهار خانة الإدخال
        if(!!state.pass!==hadPass&&document.body.contains(state.gateEl)){
          document.body.removeChild(state.gateEl);
          showSplashGate(state, cb);
        }
      }).catch(()=>{});
    }
  }catch(e){}
}

            <span style="font-size:24px">🎓</span>
          </div>
        </div>
        <div class="g-orn" style="text-align:center;font-size:16px;margin-bottom:10px">❧ ✦ ❧</div>
        <div style="text-align:center;margin-bottom:6px">

        <div class="g-orn" style="text-align:center;font-size:13px;margin-bottom:18px">─── ✦ ───</div>
        ${stored?`
        <div style="position:relative;margin-bottom:8px">
          <input id="gate-inp" type="password" placeholder="كلمة المرور..." autocomplete="current-password"
            style="width:100%;box-sizing:border-box;background:rgba(10,30,55,.8);border:1.5px solid #c9a84c;border-radius:12px;padding:13px 44px 13px 16px;color:#eef0f8;font-family:Tajawal,sans-serif;font-size:15px;outline:none;text-align:right;direction:rtl;transition:border-color .2s,box-shadow .2s">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7">🔑</span>
        </div>
        <div id="gate-err" style="color:#f5576c;font-size:12px;min-height:16px;text-align:center;margin-bottom:8px"></div>`:''}
        <button id="gate-btn"
          style="width:100%;background:linear-gradient(135deg,#1a3a8f,#2952c4,#1a3a8f);border:2px solid #c9a84c;border-radius:12px;padding:14px;color:#fff;font-family:Tajawal,sans-serif;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(41,82,196,.4);transition:transform .1s,box-shadow .1s">

      </div>
      <div style="text-align:center;margin-top:16px;color:#c9a84c;font-size:13px;letter-spacing:2px;font-weight:700">👤 ahmedalynawy2005</div>

  document.body.appendChild(gate);
  state.gateEl=gate;
  const btn=gate.querySelector('#gate-btn');
  const inp=gate.querySelector('#gate-inp');

  if(inp)inp.focus();

  function closeGate(){
    state.loggedIn=true;

  function tryLogin(){
    if(!state.pass){closeGate();return;}
    const val=inp?inp.value:'';
    if(btoa(val)===state.pass){

      if(err)err.textContent='❌ كلمة المرور غير صحيحة';
      if(inp){inp.style.borderColor='#f5576c';inp.value='';}
      setTimeout(()=>{if(inp)inp.style.borderColor='#c9a84c';if(err)err.textContent='';},2000);
    }
  }
  btn.onclick=tryLogin;

    inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
  }
}

    DB.profile=ld('profile');
    DB.timetable=ld('timetable');
    DB.exams=ld('exams');
    DB.plan=ld('plan');
    DB.completed=ld('completed');
    DB.gen=ld('gen');
    DB.net=ld('net');
    DB.semesters=ld('semesters');
    DB.uniInfo=ld('uniInfo');
    DB.academicManual=ld('academicManual')||{};
    DB.documents=DB.documents||ld('documents')||[];
    DB.albums=DB.albums||ld('albums')||[];
    DB.deptNames=ld('deptNames')||{gen:'قسم العام',net:'قسم الشبكات'};
    DB.deptIcons=ld('deptIcons')||{};
    DB.deptPlanImg=ld('deptPlanImg')||{};
    DB.deptPlanNames=ld('deptPlanNames')||{gen:'مخطط قسم العام',net:'مخطط قسم الشبكات'};
    DB.deptPlanIcons=ld('deptPlanIcons')||{gen:'🗺️',net:'🗺️'};
    DB.semCount=ld('semCount')||10;
    // تحميل الأقسام المضافة
    Object.keys(DB.deptNames).forEach(k=>{if(!DB[k])DB[k]=ld(k)||[];});
    async function initAndRender(){
      if(typeof window.loadFromCloud==='function'){
        try{
          const justCleared=sessionStorage.getItem('tdb_justCleared');
          sessionStorage.removeItem('tdb_justCleared');
          if(!justCleared){
            const loaded=await window.loadFromCloud();
            if(loaded){
              DB.profile=ld('profile');DB.timetable=ld('timetable');DB.exams=ld('exams');
              DB.plan=ld('plan');DB.completed=ld('completed');DB.gen=ld('gen');
              DB.net=ld('net');DB.semesters=ld('semesters');DB.uniInfo=ld('uniInfo');
              DB.academicManual=ld('academicManual')||{};
            }
          }
        }catch(e){}
      }
      renderHome();
      const savedHomeBg=localStorage.getItem('tdb_homebg');
      if(savedHomeBg)setTimeout(()=>applyHomeBg(savedHomeBg),100);
      if(typeof window.startRealtimeSync==='function')window.startRealtimeSync();
    }
    initAndRender();
  });
});
